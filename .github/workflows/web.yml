name: Web CI and CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test and build
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm test
          for file in app.js api.js model.js map.js push.js proposal.js stream.js sw.js account.js account-api.js; do
            if [[ -f "$file" ]]; then node --check "$file"; fi
          done
          bash -n deploy/workflow.sh
          mkdir -p build/release
          FILES=(index.html style.css app.js api.js model.js)
          for file in map.js push.js proposal.js stream.js sw.js manifest.webmanifest account.html account.css account.js account-api.js; do
            if [[ -f "$file" ]]; then FILES+=("$file"); fi
          done
          tar -czf build/release/web.tar.gz "${FILES[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: build/release/web.tar.gz
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.MAJUNG_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ github.sha }}
          path: release
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy verified web artifact
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
          GCP_INSTANCE_ID: ${{ secrets.GCP_INSTANCE_ID }}
          GCP_SSH_USER: ${{ secrets.GCP_SSH_USER }}
          GCP_SSH_HOST_KEY: ${{ secrets.GCP_SSH_HOST_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/workflow.sh web release/web.tar.gz
